name: Build docker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag"
        required: true
        default: "jdk25"

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          push: true
          tags: |
            ghcr.io/tailoringexpert/devcontainer:${{ github.event.inputs.image_tag }}
            ghcr.io/tailoringexpert/devcontainer:latest
